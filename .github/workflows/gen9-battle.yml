name: Generation 9 battle engine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gen9-showdown-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install root dependencies
        run: npm install
      - name: Check server and data exporter syntax
        run: |
          node --check js/app.js
          node --check server/index.js
          node --check server/gen9-engine.js
          node --check server/auto-audit.js
          node --check scripts/export-showdown-catalog.js
          node --check js/upstream-loader.js
      - name: Audit battle timers and browser patch ownership
        run: npm run test:runtime-overrides
      - name: Rebuild and validate committed catalogue
        run: npm run data:export
      - name: Run full battle and offline Showdown regression suite
        run: npm test
      - name: Run compact battle UI smoke tests
        run: npm run test:battle-ui
