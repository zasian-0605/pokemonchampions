name: Generation 9 battle engine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gen9-showdown-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install root dependencies
        run: npm install
      - name: Run Generation 9 simulator smoke test
        run: npm test
